name: nyc_taxi
version: '1.0.0'
config-version: 2

profile: nyc_taxi

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  nyc_taxi:
    staging:
      +materialized: view
      +schema: staging
    silver:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
      dimensions:
        +materialized: table
      facts:
        +materialized: table
      aggregates:
        +materialized: table
